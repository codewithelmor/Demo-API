# Spectral ruleset for OpenAPI documents generated by ASP.NET Core (Microsoft.AspNetCore.OpenApi).
# Run: npx --yes @stoplight/spectral-cli@6.17.0 lint api-tests/openapi/orders-api.json --ruleset api-tests/openapi/.spectral.yaml --fail-severity error
# The OWASP ruleset (MIT) is pinned by version. Rules not listed here keep their default severity.
# Change a rule to "off" only with a reason in a comment. Prefer fixing the API or its OpenAPI document.
extends:
  - spectral:oas
  - https://unpkg.com/@stoplight/spectral-owasp-ruleset@2.0.1/dist/ruleset.mjs

rules:
  # The generated document has no servers block. The base URL comes from the test environment files.
  oas3-api-servers: off
  owasp:api8:2023-no-server-http: off
  owasp:api9:2023-inventory-access: off
  owasp:api9:2023-inventory-environment: off

  # Security scheme must say how JWTs are validated (RFC 8725). Set the scheme Description in the document transformer.
  owasp:api2:2023-jwt-best-practices: error

  # Limits on every string, integer, and array (including ProblemDetails and response DTOs) are noisy for ASP.NET Core.
  # Request DTOs must still use [property: StringLength] and [property: Range]; api-test-review checks this.
  owasp:api4:2023-string-limit: warn
  owasp:api4:2023-string-restricted: warn
  owasp:api4:2023-integer-limit: warn
  owasp:api4:2023-integer-limit-legacy: warn
  owasp:api4:2023-array-limit: warn

  # Set back to error when the API uses the ASP.NET Core rate limiter and documents 429 and its headers.
  owasp:api4:2023-rate-limit: warn
  owasp:api4:2023-rate-limit-retry-after: warn
  owasp:api4:2023-rate-limit-responses-429: warn

  # Generated 401 and 403 responses have no body, and 500 is not documented on purpose.
  owasp:api8:2023-define-error-responses-401: warn
  owasp:api8:2023-define-error-responses-500: warn
