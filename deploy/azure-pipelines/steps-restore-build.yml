# Shared steps: SDK from global.json, NuGet cache, locked restore, Release build (warnings are errors).
steps:
  - checkout: self
    fetchDepth: 1

  - task: UseDotNet@2
    displayName: Use .NET SDK from global.json
    inputs:
      packageType: sdk
      useGlobalJson: true

  - task: Cache@2
    displayName: Cache NuGet packages
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,!**/bin/**,!**/obj/**'
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: $(NUGET_PACKAGES)

  - script: dotnet restore DemoApi.slnx --locked-mode
    displayName: Restore (locked mode)

  - script: dotnet build DemoApi.slnx -c Release --no-restore
    displayName: Build (Release, warnings as errors)
